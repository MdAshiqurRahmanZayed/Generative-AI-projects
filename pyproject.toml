    "langchain-community>=0.3,<0.4",
    "langchain-google-genai>=2.0",
    "langchain-ollama>=0.2",
    "chromadb>=0.5",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "httpx>=0.27",
    "ipython>=8.0",
    "jupyter>=1.0",
]
