[project]
name = "generative-ai-projects"
version = "0.1.0"
description = "Collection of generative AI experiments and small apps (Gemini, DeepSeek/Ollama, LangChain, Streamlit)."
authors = [
    { name = "ashiqur-zayed-strativ", email = "ashiqur.zayed@strativ.se" }
]
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.38",
    "langchain[google-genai,openai]>=1.0",
    "langchain-core>=1.0",
    "langchain-community>=0.3",
    "langchain-classic>=1.0",
    "langchain-google-genai>=2.0",
    "langchain-ollama>=0.2",
    "deepagents>=0.1",
    "chromadb>=0.5",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "httpx>=0.27",
    "ipython>=8.0",
    "jupyter>=1.0",
    "beautifulsoup4>=4.15.0",
    "langchain-chroma>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.4.6",
    "pypdf>=6.20.1",
    "docx2txt>=0.9",
]
